function sh(b,dr,dc){const o=Array.from({length:20},()=>new Array(20).fill(0));for(let r=0;r<20;r++)for(let c=0;c<20;c++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<20&&nc>=0&&nc<20)o[nr][nc]=b[r][c];}return o;}
function pt(b,ops){const o=b.map(r=>r.slice());ops.forEach(([r,c,v])=>{if(r>=0&&r<20&&c>=0&&c<20)o[r][c]=v;});return o;}
function mount(host,opts={}){const{p,color='#CD7F6A',bg='#0f0f0f',speed=1,autoplay=true}=opts;host.innerHTML='';host.style.position='relative';host.style.width='100%';host.style.aspectRatio='1/1';host.style.background=bg;host.style.display='grid';host.style.gridTemplateColumns='repeat(20,1fr)';host.style.gridTemplateRows='repeat(20,1fr)';const cel=[];for(let r=0;r<20;r++){cel.push([]);for(let c=0;c<20;c++){const d=document.createElement('div');host.appendChild(d);cel[r].push(d);}}function paint(f){for(let r=0;r<20;r++)for(let c=0;c<20;c++){const v=f[r][c],e=cel[r][c];e.style.background=v===B?color:v===E?'#0f0f0f':'transparent';e.style.boxShadow=v===B?'inset 0 0 0 1px rgba(0,0,0,0.35)':'none';}}let _p=p,_s=speed,_a=autoplay,i=0,st=performance.now(),rf;function tick(now){if(_a&&_p.frames.length>1){const e=(now-st)*_s;if(e>=_p.frames[i].hold){i=(i+1)%_p.frames.length;st=now;paint(_p.frames[i].frame||C);}}rf=requestAnimationFrame(tick);}paint(_p.frames[0].frame||C);rf=requestAnimationFrame(tick);return{destroy(){cancelAnimationFrame(rf);host.innerHTML='';}};}
